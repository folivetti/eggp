name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  merge_group:
  workflow_dispatch:

defaults:
  run:
    shell: sh

env:
  # 04-08-2023:
  # cibuildwheel builds linux wheels in a manylinux_ghc container, which
  # hardcodes the GHC and Cabal version. To change the GHC and Cabal versions,
  # you must update the containers in pyproject.toml under tool.cibuildwheel.
  #
  # See: https://github.com/wenkokke/manylinux_ghc
  DEFAULT_GHC_VERSION: "9.14.1"
  DEFAULT_CABAL_VERSION: "3.16"
  DEFAULT_PYTHON_VERSION: "3.12"

jobs:
  ################################################################################
  # Build package with cibuildwheel
  ################################################################################

  build:
    name: "Build / ${{ matrix.job.os.name }} / ${{ matrix.job.os.plat}}-${{ matrix.job.os.arch }}"
    runs-on: ${{ matrix.job.os.runner }}

    strategy:
      matrix:
        job:
          #- os:
          #    name: "Linux"
          #    runner: "ubuntu-24.04-arm"
          #    arch: "aarch64"
          #    plat: "manylinux"
          #- os:
          #    name: "Linux"
          #    runner: "ubuntu-latest"
          #    arch: "i686"
          #    plat: "manylinux"
          #- os:
          #    name: "Linux"
          #    runner: "ubuntu-latest"
          #    arch: "x86_64"
          #    plat: "manylinux"
          #- os:
          #    name: "Linux"
          #    runner: "ubuntu-latest"
          #    arch: "x86_64"
          #    plat: "musllinux"
          - os:
              name: "macOS"
              runner: "macos-15-intel"
              arch: "x86_64"
              plat: "macosx"
          #- os:
          #    name: "macOS"
          #    runner: "macos-15"
          #    arch: "arm64"
          #    plat: "macosx"
          #- os:
          #    name: "Windows"
          #    runner: "windows-latest"
          #    arch: "AMD64"
          #    plat: "win"

    steps:
      - uses: actions/checkout@v6

      - # 12-02-2024:
        # Print the macOS architecture.
        if: matrix.job.os.name == 'macOS'
        run: echo "::debug::$(uname -a)"

      - # Required to run job via act: https://github.com/nektos/act
        uses: actions/setup-python@v6
        with:
          cache: "pip"
          cache-dependency-path: "./requirements-ci.txt"
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      - # Required to run job via act: https://github.com/nektos/act
        run: pip install -r "./requirements-ci.txt"

      - if: matrix.job.os.name == 'macOS'
        name: Install GHC and Cabal via ghcup
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then GHCUP_ARCH="aarch64-apple-darwin"; else GHCUP_ARCH="x86_64-apple-darwin"; fi
          curl -L https://github.com/haskell/ghcup-hs/releases/download/v0.2.6.2/${GHCUP_ARCH}-ghcup-0.2.6.2 -o /usr/local/bin/ghcup
          chmod +x /usr/local/bin/ghcup
          ghcup install ghc 9.14.1
          ghcup install cabal 3.16
          ghcup set ghc 9.14.1
          export PATH="$HOME/.ghcup/bin:$PATH"
          cabal update
          echo "$HOME/.ghcup/bin" >> $GITHUB_PATH
          echo "GHC=$HOME/.ghcup/bin/ghc" >> $GITHUB_ENV
          echo "CABAL=$HOME/.ghcup/bin/cabal" >> $GITHUB_ENV

      - if: matrix.job.os.name == 'Windows'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.DEFAULT_GHC_VERSION }}
          cabal-version: ${{ env.DEFAULT_CABAL_VERSION }}

      - # 12-02-2024:
        # Print the GHC architecture.
        if: matrix.job.os.name == 'macOS' || matrix.job.os.name == 'Windows'
        run: echo "::debug::$(ghc --info)"
        
      - if: matrix.job.os.name == 'Windows'
        name: Install build tools with Chocolatey
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install make
          choco install mingw

      - if: matrix.job.os.name == 'Windows'
        name: Build and install nlopt
        run: |
          git clone https://github.com/stevengj/nlopt.git
          cd nlopt
          mkdir build
          cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_INSTALL_PREFIX=C:\\nlopt
          mingw32-make
          mingw32-make install

      - if: matrix.job.os.name == 'Windows'
        name: Debug nlopt installation
        run: |
          dir C:\\nlopt\\lib
          dir C:\\nlopt\\include
          dir C:\\nlopt\\bin

      - if: matrix.job.os.name == 'Windows'
        name: Configure environment variables
        run: |
          echo "LIBRARY_PATH=C:\\nlopt\\lib" >> $env:GITHUB_ENV
          echo "CPATH=C:\\nlopt\\include" >> $env:GITHUB_ENV
          echo "PATH=C:\\nlopt\\bin${{ env.PATH }}" >> $env:GITHUB_ENV

     
      - if: matrix.job.os.name == 'macOS'
        name: Install Homebrew dependencies
        run: |
          brew update
          brew install nlopt libpq
      - if: matrix.job.os.name == 'macOS'
        name: Configure environment variables
        run: |
          echo "LIBRARY_PATH=/usr/local/lib:/opt/homebrew/lib" >> $GITHUB_ENV
          echo "CPATH=/usr/local/include:/opt/homebrew/include" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=/opt/homebrew/lib" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV
          echo "PATH=/usr/local/opt/libpq/bin:/opt/homebrew/opt/libpq/bin:$PATH" >> $GITHUB_ENV
          
      - # 19-06-2023:
        # Required to build aarch64 wheels.
        if: matrix.job.os.name == 'Linux' && matrix.job.os.arch == 'aarch64'
        name: Set up QEMU (linux/aarch64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: "arm64"

      - # 19-06-2023:
        # Required to build i686 wheels.
        if: matrix.job.os.name == 'Linux' && matrix.job.os.arch == 'i686'
        name: Set up QEMU (linux/i686)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: "386"

      - uses: pypa/cibuildwheel@v3.4.0
        with:
          output-dir: "./wheelhouse"
          config-file: "{package}/pyproject.toml"
        env:
          CIBW_ARCHS: "${{ matrix.job.os.arch }}"
          CIBW_BUILD: "*${{ matrix.job.os.plat }}*"
          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y gcc gcc-c++ make cmake curl git gmp-devel libffi-devel ncurses-devel zlib-devel openssl-devel krb5-devel libxml2-devel &&
            ARCH=$(uname -m) &&
            if [ "$ARCH" = "aarch64" ]; then PG_ARCH="aarch64"; else PG_ARCH="x86_64"; fi &&
            dnf install -y https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-${PG_ARCH}/pgdg-redhat-repo-latest.noarch.rpm &&
            dnf -qy module disable postgresql &&
            dnf install -y postgresql16-devel postgresql16-libs &&
            if [ "$ARCH" = "aarch64" ]; then GHCU_ARCH="aarch64"; else GHCU_ARCH="x86_64"; fi &&
            curl -L https://github.com/haskell/ghcup-hs/releases/download/v0.2.6.2/${GHCU_ARCH}-linux-ghcup-0.2.6.2 -o /usr/local/bin/ghcup &&
            chmod +x /usr/local/bin/ghcup &&
            ghcup install ghc 9.14.1 &&
            ghcup install cabal 3.16 &&
            ghcup set ghc 9.14.1 &&
            git clone --depth 1 https://github.com/stevengj/nlopt.git /tmp/nlopt &&
            cd /tmp/nlopt && mkdir build && cd build &&
            cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local -DLIB_SUFFIX=64 &&
            make -j$(nproc) && make install && ldconfig &&
            ln -sf /usr/pgsql-16/lib/libpq.so* /usr/local/lib64/ &&
            ln -sf /usr/pgsql-16/lib/libpq.a /usr/local/lib64/ &&
            ln -sf /usr/pgsql-16/lib/pg_config* /usr/local/lib64/ &&
            ln -sf /usr/pgsql-16/include/libpq-fe.h /usr/local/include/ &&
            ln -sf /usr/pgsql-16/include/pg_config.h /usr/local/include/ &&
            ln -sf /usr/pgsql-16/include/postgresql /usr/local/include/postgresql &&
            ln -sf /usr/pgsql-16/lib/libpgcommon* /usr/local/lib64/ &&
            ldconfig
          CIBW_ENVIRONMENT_LINUX: 'PATH=/root/.ghcup/bin:/usr/pgsql-16/bin:$PATH LIBRARY_PATH=/usr/local/lib64:/usr/pgsql-16/lib LD_LIBRARY_PATH=/usr/local/lib64:/usr/pgsql-16/lib C_INCLUDE_PATH=/usr/local/include:/usr/pgsql-16/include PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig:/usr/pgsql-16/lib/pkgconfig'
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os.runner == 'macos-14' && '14.0' || '14.0' }}
      
      - # Build source distribution (sdist)
        run: |
          pip install build
          python -m build --sdist --outdir ./wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: "wheelhouse-${{ matrix.job.os.plat }}-${{ matrix.job.os.arch }}"
          path: |
             ./wheelhouse/*.whl
             ./wheelhouse/*.tar.gz

  ################################################################################
  # Publish package to GitHub Releases
  ################################################################################

  publish-to-github-releases:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "wheelhouse-*-*"
          path: "./wheelhouse"
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: "./wheelhouse/*"
          fail_on_unmatched_files: true

  ################################################################################
  # Publish package to PyPI
  ################################################################################

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]

    environment:
      name: pypi
      url: https://pypi.org/p/pyeggp

    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "wheelhouse-*-*"
          path: "./wheelhouse"
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: "./wheelhouse"
